version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Without an explicit prefix Dependabot's default subject ("Bump x from y to
    # z") is not a Conventional Commit. On a semantic-release repo that both
    # trips commit linting and cuts no release, so the bump lands on main and
    # never reaches the deployed build.
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      js-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
